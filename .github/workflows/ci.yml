name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true    
      - name: Style check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --all-targets --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build docs
        run: cargo doc --document-private-items --all-features

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-nextest
      - name: Record diagnostic toolchain
        run: |
          set -euxo pipefail
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            cargo nextest --version
          } | tee safari261-toolchain.txt
      - name: Tests
        run: | 
          set -euxo pipefail
          cargo nextest run --workspace --success-output immediate 2>&1 | tee safari261-nextest.log
      - name: Record resolved diagnostic dependencies
        if: always()
        run: |
          set -euxo pipefail
          sha256sum Cargo.lock
          cargo tree --locked --offline | tee safari261-dependencies.txt
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > safari261-metadata.json
      - name: Upload Safari diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari261-diagnostic-${{ github.sha }}
          retention-days: 7
          path: |
            Cargo.lock
            safari261-toolchain.txt
            safari261-nextest.log
            safari261-dependencies.txt
            safari261-metadata.json

  linux:
    name: Linux
    needs: [style, tests, docs]
    runs-on: ubuntu-latest
    environment: Linux
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          args: --features tokio-rt
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
